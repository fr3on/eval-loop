settings:
  - name: app
    type: app-selector
    scope: chat
    required: true
    label:
      en_US: App
    placeholder:
      en_US: The Dify chat app whose logs you want to evaluate
  - name: dify_base_url
    type: text-input
    required: true
    label:
      en_US: Dify API Base URL
    placeholder:
      en_US: "e.g. https://api.dify.ai/v1 or https://your-self-hosted-instance/v1"
    default: "https://api.dify.ai/v1"
  - name: dify_api_key
    type: secret-input
    required: true
    label:
      en_US: App API Key
    placeholder:
      en_US: The selected app's own Service API key (used to pull conversations, messages, and feedback)
  - name: target_users
    type: text-input
    required: true
    label:
      en_US: Target End Users
    placeholder:
      en_US: "Comma-separated Dify end-user identifiers to pull conversations for, e.g. user-123,user-456"
  - name: eval_model
    type: model-selector
    scope: llm
    required: true
    label:
      en_US: Eval Model
    placeholder:
      en_US: The model used to judge each Q&A's correctness and reusability
  - name: lookback_days
    type: text-input
    required: false
    label:
      en_US: Lookback Window (days)
    placeholder:
      en_US: "How many days back to pull conversations from, e.g. 1"
    default: "1"
  - name: max_messages
    type: text-input
    required: false
    label:
      en_US: Max Messages Per Run
    placeholder:
      en_US: "Safety cap on how many messages to evaluate in one run, e.g. 50"
    default: "50"
  - name: custom_instruction
    type: text-input
    required: false
    label:
      en_US: Custom Instruction
    placeholder:
      en_US: "Optional: describe this app's expected behavior so the eval judges it correctly, e.g. \"This agent should always redirect off-topic questions rather than answering them - don't penalize that as a failure.\""
  - name: save_to_dataset
    type: boolean
    required: false
    label:
      en_US: Save Report to Knowledge Base
    default: false
  - name: dataset_id
    type: text-input
    required: false
    label:
      en_US: Knowledge Base ID
    placeholder:
      en_US: "Required if 'Save Report to Knowledge Base' is on. The dataset ID to write each run's report into, as a new Document."
  - name: dataset_api_key
    type: secret-input
    required: false
    label:
      en_US: Knowledge Base API Key
    placeholder:
      en_US: "Required if 'Save Report to Knowledge Base' is on. Datasets use their own API key (Knowledge Base > API Access), separate from the App API Key above."
endpoints:
  - endpoints/run.yaml
