    - data:
        code: |
          import json

          def main(review_items: list, evaluated: int) -> dict:
              items = review_items or []
              limit = 10

              def clip(text, n=500):
                  text = (text or "").replace("\n", " ").strip()
                  return text if len(text) <= n else text[: n - 1] + "…"

              lines = [f":mag: *Eval Loop - {len(items)} answer(s) need human review* (of {evaluated} evaluated)"]
              for i, it in enumerate(items[:limit], start=1):
                  lines.append("")
                  lines.append(f"*{i}. {it.get('reason', 'review')}* - user `{it.get('user', '')}`, conversation `{it.get('conversation_id', '')}`")
                  lines.append(f"> *Message:* {clip(it.get('message'))}")
                  lines.append(f"> *Answer:* {clip(it.get('answer'))}")
                  if it.get("issue"):
                      lines.append(f"> *Issue:* {clip(it.get('issue'))}")
                  if it.get("corrected_answer"):
                      lines.append(f"> *Suggested answer:* {clip(it.get('corrected_answer'))}")
                  if it.get("feedback"):
                      lines.append(f"> *User feedback:* {it['feedback']}")
              if len(items) > limit:
                  lines.append("")
                  lines.append(f"_...and {len(items) - limit} more - see this workflow's Logs or the Knowledge Base report._")

              # Slack messages are capped at ~40k characters; stay well below.
              text = "\n".join(lines)[:35000]
              return {"payload": json.dumps({"text": text}), "review_count": len(items)}

        code_language: python3
        desc: 'Formats the flagged/disliked/errored answers from Run Eval into a Slack message (max 10 shown) and counts them.'
        outputs:
          payload:
            children: null
            type: string
          review_count:
            children: null
            type: number
        selected: false
        title: Build Slack message
        type: code
        variables:
        - value_selector:
          - run_eval_1
          - review_items
          variable: review_items
        - value_selector:
          - run_eval_1
          - evaluated
          variable: evaluated
