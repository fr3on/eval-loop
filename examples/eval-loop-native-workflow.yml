      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        desc: 'Fires automatically on this schedule. Uses the TARGET_USERS/LOOKBACK_DAYS/MAX_MESSAGES/EVAL_BATCH_SIZE environment variables as input, since a trigger has no input form of its own. Edit the time/timezone, or switch to Cron mode, after import.'
        title: Schedule Trigger
        type: trigger-schedule
        mode: visual
        frequency: daily
        cron_expression: null
        visual_config:
          time: '09:00 AM'
        timezone: UTC
      height: 116
      id: trigger_schedule_1
      position: {x: 30, y: 240}
      positionAbsolute: {x: 30, y: 240}
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244

    - data:
        desc: 'Splits Target End Users into a list and computes the lookback cutoff timestamp. Everything is sourced from Environment Variables - a Schedule Trigger has no input form of its own, and Dify does not allow a Start node and a Trigger node in the same workflow, so there is no per-run override here (edit TARGET_USERS/LOOKBACK_DAYS in the Environment Variables panel instead).'
        code: |
          import time

          def main(env_target_users, env_lookback_days) -> dict:
              raw = env_target_users or ""
              users = [u.strip() for u in raw.split(",") if u.strip()]
              # Defaults to 7 days (not 1) since test/debug conversations in
              # Studio are usually a few days old by the time you run this -
              # a 1-day window silently returns zero candidates against them.
              days = env_lookback_days or 7
              cutoff_ts = time.time() - float(days) * 86400
              return {"user_list": users, "cutoff_ts": cutoff_ts}
        code_language: python3
        outputs:
          user_list: {children: null, type: "array[string]"}
          cutoff_ts: {children: null, type: number}
        selected: false
        title: Prep Users + Cutoff
        type: code
        variables:
        - value_selector: [env, TARGET_USERS]
          variable: env_target_users
          value_type: string
        - value_selector: [env, LOOKBACK_DAYS]
          variable: env_lookback_days
          value_type: string
      height: 54
      id: code_prep
      position: {x: 334, y: 400}
      positionAbsolute: {x: 334, y: 400}
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
