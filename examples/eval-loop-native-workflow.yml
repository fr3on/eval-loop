app:
  description: 'A from-scratch clone of the eval-loop plugin''s logic, built entirely out of native Dify Workflow nodes (HTTP Request + Code + LLM + Iteration) instead of the plugin. Simplified vs. the plugin: fetches a single page (up to 100) of conversations per user and a single page of messages per conversation, instead of the plugin''s multi-page scan; fetch failures aren''t individually caught per-conversation. Everything else - batching, DPO pair generation, the summary report - mirrors the plugin, except the plugin''s newer features: loading ALL conversations via the console API (no Target End Users needed), the selected-app/API-key check, per-item retry when a batch response is malformed, passage-size capping, and the full-detail Knowledge Base document.'
  icon: 🧪
  icon_background: '#F3E8FF'
  mode: workflow
  name: Eval Loop - Native Workflow Clone
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.3.1
workflow:
  conversation_variables: []
  environment_variables:
  - value_type: string
    name: DIFY_BASE_URL
    value: 'https://dify.amwal.tech/v1'
  - value_type: secret
    name: DIFY_API_KEY
    value: ''
  - value_type: string
    name: TARGET_USERS
    value: 'DEFAULT-USER'
  - value_type: string
    name: LOOKBACK_DAYS
    value: '7'
  - value_type: string
    name: MAX_MESSAGES
    value: '50'
  - value_type: string
    name: EVAL_BATCH_SIZE
    value: '5'
  - value_type: string
    name: CUSTOM_INSTRUCTION
    value: ''
  - value_type: string
    name: DATASET_ID
    value: ''
  - value_type: secret
    name: DATASET_API_KEY
    value: ''
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    edges:
    - data: {isInIteration: false, isInLoop: false, sourceType: trigger-schedule, targetType: code}
      id: trigger-to-prep
      source: trigger_schedule_1
      sourceHandle: source
      target: code_prep
      targetHandle: target
      type: custom
      zIndex: 0
    - data: {isInIteration: false, isInLoop: false, sourceType: code, targetType: iteration}
      id: prep-to-iter-users
      source: code_prep
      sourceHandle: source
      target: iteration_users
      targetHandle: target
      type: custom
      zIndex: 0
    - data: {isInIteration: true, isInLoop: false, iteration_id: iteration_users, sourceType: iteration-start, targetType: http-request}
      id: iter-users-start-to-http-conv
      source: iteration_usersstart
      sourceHandle: source
      target: http_conversations
      targetHandle: target
      type: custom
      zIndex: 1002
    - data: {isInIteration: true, isInLoop: false, iteration_id: iteration_users, sourceType: http-request, targetType: code}
      id: http-conv-to-code-conv-ids
      source: http_conversations
      sourceHandle: source
      target: code_conv_ids
      targetHandle: target
      type: custom
      zIndex: 1002
    - data: {isInIteration: false, isInLoop: false, sourceType: iteration, targetType: iteration}
      id: iter-users-to-iter-convs
      source: iteration_users
      sourceHandle: source
      target: iteration_convs
      targetHandle: target
      type: custom
      zIndex: 0
    - data: {isInIteration: true, isInLoop: false, iteration_id: iteration_convs, sourceType: iteration-start, targetType: code}
      id: iter-convs-start-to-extract
      source: iteration_convsstart
      sourceHandle: source
      target: code_extract_pair
      targetHandle: target
      type: custom
      zIndex: 1002
    - data: {isInIteration: true, isInLoop: false, iteration_id: iteration_convs, sourceType: code, targetType: http-request}
      id: extract-to-http-messages
      source: code_extract_pair
      sourceHandle: source
      target: http_messages
      targetHandle: target
      type: custom
      zIndex: 1002
    - data: {isInIteration: true, isInLoop: false, iteration_id: iteration_convs, sourceType: http-request, targetType: code}
