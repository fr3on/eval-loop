    - data:
        desc: 'Parses the eval model''s JSON array reply, falling back to per-item error verdicts (matching the whole batch) on any parse failure or length mismatch.'
        code: |
          import json
          import re

          def main(llm_text: str, batch_text: str) -> dict:
              batch_len = max(1, (batch_text or "").count("--- Pair "))
              content = (llm_text or "").strip()
              content = re.sub(r"^```(?:json)?\s*|\s*```$", "", content, flags=re.MULTILINE).strip()

              def error_verdict(msg: str) -> dict:
                  return {"grounded": None, "relevant": None, "correct": None, "reusable": None,
                          "issue": f"eval error: {msg}", "corrected_answer": ""}

              try:
                  parsed = json.loads(content)
                  if not isinstance(parsed, list) or len(parsed) != batch_len:
                      raise ValueError("unexpected shape or length")
                  verdicts = [{
                      "grounded": bool(v.get("grounded")),
                      "relevant": bool(v.get("relevant")),
                      "correct": bool(v.get("correct")),
                      "reusable": bool(v.get("reusable")),
                      "issue": v.get("issue", ""),
                      "corrected_answer": v.get("corrected_answer") or "",
                  } for v in parsed]
              except Exception as e:
                  verdicts = [error_verdict(str(e)) for _ in range(batch_len)]

              return {"verdicts": verdicts}
        code_language: python3
        isInIteration: true
        isInLoop: false
        iteration_id: iteration_batches
        outputs:
          verdicts: {children: null, type: "array[object]"}
        selected: false
