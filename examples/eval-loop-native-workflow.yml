    - data:
        desc: 'Zips candidates with their verdicts (order-preserving, same as the plugin), derives DPO pairs, and renders the summary report.'
        code: |
          def main(candidates: list, verdicts: list) -> dict:
              candidates = candidates or []
              verdicts = verdicts or []
              results = []
              for item, verdict in zip(candidates, verdicts):
                  entry = {k: v for k, v in item.items() if k != "passages"}
                  entry["eval"] = verdict
                  results.append(entry)

              dpo_pairs = [
                  {"prompt": r["message"], "chosen": r["eval"]["corrected_answer"], "rejected": r["answer"]}
                  for r in results
                  if r["eval"].get("correct") is False and r["eval"].get("corrected_answer")
              ]

              total = len(results)
              if total == 0:
                  summary = "## Eval Loop (Workflow Clone) Report\n\nNo messages found in the configured window."
              else:
                  correct = sum(1 for r in results if r["eval"].get("correct") is True)
                  grounded = sum(1 for r in results if r["eval"].get("grounded") is True)
                  reusable = sum(1 for r in results if r["eval"].get("reusable") is True)
                  flagged = [r for r in results if r["eval"].get("correct") is False]
                  eval_errors = sum(1 for r in results if r["eval"].get("correct") is None)

                  def cell(text, limit=80):
                      text = (text or "").replace("|", "\\|").replace("\n", " ")
                      return text if len(text) <= limit else text[:limit - 1] + "..."

                  lines = [
                      "## Eval Loop (Workflow Clone) Report",
                      "",
                      f"- **Evaluated:** {total} message(s)",
                      f"- **Correct:** {correct}/{total} ({correct * 100 // total}%)",
                      f"- **Grounded:** {grounded}/{total}",
                      f"- **Reusable candidates:** {reusable}",
                      f"- **DPO pairs generated:** {len(dpo_pairs)}",
                      f"- **Eval errors:** {eval_errors}",
                  ]
                  if flagged:
                      lines += ["", "### Flagged (incorrect)", "", "| User | Message | Answer | Issue |", "| --- | --- | --- | --- |"]
                      for r in flagged:
                          lines.append(f"| {cell(r['user'], 20)} | {cell(r['message'])} | {cell(r['answer'])} | {cell(r['eval'].get('issue', ''))} |")
                  summary = "\n".join(lines)

              return {"summary_markdown": summary, "evaluated": total, "dpo_pairs": dpo_pairs}
        code_language: python3
        outputs:
          summary_markdown: {children: null, type: string}
          evaluated: {children: null, type: number}
          dpo_pairs: {children: null, type: "array[object]"}
        selected: false
        title: Assemble Report
        type: code
        variables:
        - value_selector: [code_cap, candidates]
          variable: candidates
          value_type: array[object]
        - value_selector: [iteration_batches, output]
          variable: verdicts
          value_type: array[object]
