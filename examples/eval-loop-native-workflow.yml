        type: http-request
        url: '{{#env.DIFY_BASE_URL#}}/messages?conversation_id={{#code_extract_pair.conversation_id#}}&user={{#code_extract_pair.user#}}&limit=100'
        variables: []
      height: 90
      id: http_messages
      parentId: iteration_convs
      position: {x: 432, y: 68}
      positionAbsolute: {x: 1690, y: 468}
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
      zIndex: 1002

    - data:
        desc: 'Filters messages by cutoff, drops empty pairs, and carries feedback + retrieved passages through - exactly like the plugin''s _collect_from_conversation.'
        code: |
          import json

          def main(body: str, cutoff_ts: float, user: str) -> dict:
              try:
                  data = json.loads(body or "{}")
              except Exception:
                  return {"candidates": []}
              out = []
              for msg in data.get("data", []):
                  if (msg.get("created_at") or 0) < cutoff_ts:
                      continue
                  message = (msg.get("query") or "").strip()
                  answer = (msg.get("answer") or "").strip()
                  if not message or not answer:
                      continue
                  feedback = (msg.get("feedback") or {}).get("rating")
                  passages = [
                      r.get("content")
                      for r in (msg.get("retriever_resources") or [])
                      if r.get("content")
                  ]
                  out.append({
                      "user": user,
                      "conversation_id": msg.get("conversation_id"),
                      "message_id": msg.get("id"),
                      "created_at": msg.get("created_at"),
                      "message": message,
                      "answer": answer,
                      "feedback": feedback,
                      "passages": passages,
                  })
              return {"candidates": out}
        code_language: python3
        isInIteration: true
        isInLoop: false
        iteration_id: iteration_convs
        outputs:
          candidates: {children: null, type: "array[object]"}
        selected: false
        title: Build Candidates
        type: code
        variables:
        - value_selector: [http_messages, body]
          variable: body
          value_type: string
        - value_selector: [code_prep, cutoff_ts]
          variable: cutoff_ts
          value_type: number
        - value_selector: [code_extract_pair, user]
          variable: user
          value_type: string
      height: 54
      id: code_candidates
      parentId: iteration_convs
      position: {x: 736, y: 68}
      positionAbsolute: {x: 1994, y: 468}
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
      zIndex: 1002

    - data:
        desc: 'Caps the total candidate count at the MAX_MESSAGES env var. Also drops any null entries left behind by a failed fetch (e.g. a conversation/message lookup that errored under continue-on-error), so a partial failure degrades gracefully instead of crashing downstream nodes.'
        code: |
          def main(candidates: list, env_max_messages) -> dict:
              cap = int(env_max_messages) if env_max_messages else 50
              clean = [c for c in (candidates or []) if c]
              return {"candidates": clean[:cap]}
        code_language: python3
        outputs:
          candidates: {children: null, type: "array[object]"}
        selected: false
        title: Cap to Max Messages
        type: code
        variables:
        - value_selector: [iteration_convs, output]
          variable: candidates
          value_type: array[object]
        - value_selector: [env, MAX_MESSAGES]
          variable: env_max_messages
          value_type: string
      height: 54
      id: code_cap
      position: {x: 2126, y: 400}
      positionAbsolute: {x: 2126, y: 400}
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244

    - data:
        desc: 'Chunks candidates into EVAL_BATCH_SIZE groups and builds each batch''s eval-model prompt text - matching the plugin''s _build_batch_user_content.'
        code: |
          def main(candidates: list, env_eval_batch_size) -> dict:
              size = max(1, int(env_eval_batch_size) if env_eval_batch_size else 5)
              candidates = candidates or []
              batches = [candidates[i:i + size] for i in range(0, len(candidates), size)]
              prompts = []
              for batch in batches:
                  blocks = []
                  for i, item in enumerate(batch, start=1):
                      block = f"--- Pair {i} ---\nUser message: {item['message']}\n\nAgent's answer: {item['answer']}"
                      passages = item.get("passages")
                      if passages:
                          joined = "\n\n---\n\n".join(passages)
                          block += f"\n\nRetrieved knowledge-base passages available when this answer was generated:\n{joined}"
                      else:
                          block += "\n\n(No knowledge-base passages were retrieved for this answer.)"
                      feedback = item.get("feedback")
                      if feedback:
                          block += f"\n\nUser feedback on this answer: {feedback}"
                      blocks.append(block)
                  prompts.append("\n\n".join(blocks))
              return {"batch_prompts": prompts}
        code_language: python3
        outputs:
          batch_prompts: {children: null, type: "array[string]"}
        selected: false
        title: Build Eval Batches
        type: code
        variables:
        - value_selector: [code_cap, candidates]
          variable: candidates
          value_type: array[object]
        - value_selector: [env, EVAL_BATCH_SIZE]
          variable: env_eval_batch_size
          value_type: string
      height: 54
      id: code_batches
      position: {x: 2430, y: 400}
      positionAbsolute: {x: 2430, y: 400}
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244

    - data:
        desc: 'Judges each batch of message/answer pairs with the Eval Model in one LLM call.'
        error_handle_mode: continue-on-error
        flatten_output: true
        height: 178
        is_parallel: false
        iterator_input_type: array[string]
        iterator_selector: [code_batches, batch_prompts]
        output_selector: [code_parse_batch, verdicts]
        output_type: array[array[object]]
        parallel_nums: 3
        selected: false
        start_node_id: iteration_batchesstart
        title: Per-Batch - Evaluate
        type: iteration
        width: 588
      height: 178
      id: iteration_batches
      position: {x: 2734, y: 400}
      positionAbsolute: {x: 2734, y: 400}
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 588
      zIndex: 1

    - data: {desc: '', isInIteration: true, selected: false, title: '', type: iteration-start}
      draggable: false
      height: 48
      id: iteration_batchesstart
      parentId: iteration_batches
      position: {x: 24, y: 68}
      positionAbsolute: {x: 2758, y: 468}
      selectable: false
      sourcePosition: right
      targetPosition: left
      type: custom-iteration-start
      width: 44
      zIndex: 1002

    - data:
        desc: 'IMPORTANT: pick a model you actually have configured in this workspace after import - this default is a guess and will likely need changing.'
        isInIteration: true
        isInLoop: false
        iteration_id: iteration_batches
        model:
          provider: langgenius/openrouter/openrouter
          name: 'google/gemma-4-31b-it:nitro'
          mode: chat
        prompt_template:
        - role: system
          text: |
            You are auditing real support-agent conversation logs for quality.

            You may be given the actual knowledge-base passages that were retrieved and available when each answer was generated. If passages are provided for a pair, ground your judgment in them - this is the real source of truth, not general knowledge. If no passages are provided, judge plausibility and internal coherence instead.

            Not every message needs a substantive, KB-grounded answer. A greeting, an off-topic request, or anything outside what this agent is meant to handle may correctly receive a brief acknowledgment, decline, or redirect instead - judge such a response on whether it's the appropriate reply to that message, not on whether it happens to cite a knowledge-base passage. A deliberate redirect isn't a factual claim, so don't mark it ungrounded just because no passage discusses the off-topic subject. Only genuine in-scope questions need to be checked for substantive, grounded correctness.

            For each message/answer pair, judge:
            - "grounded": for a genuine in-scope question, whether the answer is actually supported by the retrieved passages, with no claims that go beyond or contradict them. For a greeting/off-topic/out-of-scope message where a brief decline or redirect is the appropriate reply, a correct redirect counts as grounded.
            - "relevant": whether the answer is the appropriate response to what the user was asking or trying to accomplish - which can be a redirect or brief acknowledgment when that's the right call, not only a literal on-topic answer.
            - "correct": your overall judgment of accuracy and appropriateness, combining groundedness and relevance.
            - "reusable": whether this Q&A is generalizable knowledge that would help a different user asking something similar - not a one-off case tied to specific names, order IDs, or dates, and not a greeting/small-talk/redirect exchange.
            - "issue": a short note describing what's wrong (empty string if nothing is wrong).
            - "corrected_answer": ONLY when "correct" is false, write what the answer should have said instead - grounded in the retrieved passages if provided, otherwise your best correction. Leave as an empty string when "correct" is true.

            If real user feedback is provided for a pair and it's negative ("dislike"), treat that as a strong signal the answer may be wrong, and explain what likely went wrong.

            Additional guidance specific to this app, from its operator:
            {{#env.CUSTOM_INSTRUCTION#}}

            You will be given a numbered list of message/answer pairs to judge in this single request.

            Respond with ONLY a raw JSON array, no markdown fences, no commentary, with exactly one object per pair, IN THE SAME ORDER as given:
            [{"grounded": true or false, "relevant": true or false, "correct": true or false, "reusable": true or false, "issue": "...", "corrected_answer": "..."}, ...]
        - role: user
          text: '{{#iteration_batches.item#}}'
        vision: {enabled: false, configs: {variable_selector: []}}
        memory: {enabled: false, window: {enabled: false, size: 50}}
        context: {enabled: false, variable_selector: []}
        structured_output: {enabled: false}
        retry_config:
          enabled: false
