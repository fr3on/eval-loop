          import json

          def main(body: str, cutoff_ts: float, user: str) -> dict:
              try:
                  data = json.loads(body or "{}")
              except Exception:
                  return {"pairs": []}
              pairs = [
                  {"user": user, "conversation_id": c["id"]}
                  for c in data.get("data", [])
                  if (c.get("created_at") or 0) >= cutoff_ts
              ]
              return {"pairs": pairs}
        code_language: python3
        isInIteration: true
        isInLoop: false
        iteration_id: iteration_users
        outputs:
