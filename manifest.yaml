version: 0.1.0
type: plugin
author: fr3on
name: eval-loop
label:
  en_US: Eval Loop
description:
  en_US: "Pulls a Dify chat app's conversation logs, retrieved knowledge-base context, and user feedback, then evaluates each Q&A for groundedness, relevance, correctness, and reusability."
icon: icon.svg
tags: ['productivity', 'utilities']
resource:
  memory: 268435456
  permission:
    tool:
      enabled: true
    model:
      enabled: true
      llm: true
      text_embedding: false
      rerank: false
      tts: false
      speech2text: false
      moderation: false
    app:
      enabled: true
    storage:
      enabled: false
      size: 1048576
plugins:
  tools:
    - provider/eval_loop.yaml
meta:
  version: 0.1.0
  arch:
    - amd64
    - arm64
  runner:
    language: python
    version: "3.12"
    entrypoint: main
created_at: 2026-09-13T00:00:00Z
privacy: PRIVACY.md
verified: false
