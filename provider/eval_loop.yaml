credentials_for_provider:
  dify_base_url:
    type: text-input
    required: true
    label:
      en_US: Dify API Base URL
    placeholder:
      en_US: "e.g. https://api.dify.ai/v1 or https://your-self-hosted-instance/v1"
    default: "https://api.dify.ai/v1"
  dify_api_key:
    type: secret-input
    required: true
    label:
      en_US: App API Key
    placeholder:
      en_US: The selected app's own Service API key (used to pull conversations, messages, and feedback)
  save_to_dataset:
    type: select
    required: false
    label:
      en_US: Save Report to Knowledge Base
    options:
      - value: "off"
        label:
          en_US: "Off"
      - value: "on"
        label:
          en_US: "On"
    default: "off"
  dataset_id:
    type: text-input
    required: false
    label:
      en_US: Knowledge Base ID
    placeholder:
      en_US: "Required if 'Save Report to Knowledge Base' is on. The dataset ID to write each run's report into, as a new Document."
  dataset_api_key:
    type: secret-input
    required: false
    label:
      en_US: Knowledge Base API Key
    placeholder:
      en_US: "Required if 'Save Report to Knowledge Base' is on. Datasets use their own API key (Knowledge Base > API Access), separate from the App API Key above."
extra:
  python:
    source: provider/eval_loop.py
identity:
  author: fr3on
  name: eval_loop
  icon: icon.svg
  label:
    en_US: Eval Loop
  description:
    en_US: "Pulls a Dify chat app's conversation logs, retrieved knowledge-base context, and user feedback, then evaluates each Q&A for groundedness, relevance, correctness, and reusability."
  tags:
    - productivity
    - utilities
tools:
  - tools/run_eval.yaml
